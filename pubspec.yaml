name: hitha_doctor_mobile
description: "Hitha Telehealth Practitioner Mobile Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  provider: ^6.1.5+1

  # Declarative Routing & Shell Navigation
  go_router: ^17.5.0

  # REST API Client
  http: ^1.6.0

  # Hardware-backed Secure Token Storage (Keystore / Keychain)
  flutter_secure_storage: ^11.2.0

  # Typography (Plus Jakarta Sans & JetBrains Mono)
  google_fonts: ^8.2.1

  # Date, Time & LKR Currency Formatting
  intl: ^0.20.3

  # In-App Browser & WebRTC WebView
  webview_flutter: ^4.14.1

  # System Intents (Phone dialer 1926, external URLs)
  url_launcher: ^6.3.2

  # Document handling & Prescription storage
  file_picker: ^13.1.0
  path_provider: ^2.1.6

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
